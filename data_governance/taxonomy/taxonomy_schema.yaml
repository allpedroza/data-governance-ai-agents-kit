# SEÇÃO 3: CONTEXT-BASED RULES
# ============================================================
context_rules:
  - rule_type: "single_entity"
    title: "Single-Entity Tables"
    subtitle: "Omita prefixos redundantes (tabelas de uma entidade)"
    definition: "Tabelas contendo apenas um tipo de entidade (dimensões ou fact-tables específicos). O nome da tabela já fornece contexto, então prefixos são redundantes."
    applicable_to:
      - "Tabelas de dimensão (CUSTOMER, DEALER, VEHICLE)"
      - "Fact-tables específicos de entidade"
    examples:
      CUSTOMER: ["Name", "Country", "NationalID"]
      DEALER: ["Code", "Name", "Country"]
      VEHICLE: ["VIN", "LicensePlate"]
    anti_patterns:
      CUSTOMER: ["CustomerName", "CustomerCountry"]
      DEALER: ["DealerCode"]
      VEHICLE: ["VehicleVIN"]
    rationale: "O nome da tabela fornece contexto de entidade. Adicionar prefixo cria redundância e aumenta complexidade para consumidores downstream e validação por IA."

  - rule_type: "multi_entity"
    title: "Multi-Entity Tables"
    subtitle: "SEMPRE use prefixo (tabelas com múltiplas entidades)"
    definition: "Tabelas desnormalizadas ou fact-tables contendo referências de FK para múltiplas entidades. Prefixos desambiguam qual entidade cada atributo pertence."
    applicable_to:
      - "Fact-tables (CONTRACT, SCHEDULE, TRANSACTION)"
      - "Tabelas desnormalizadas de reporting (DEALER_PERFORMANCE, CUSTOMER_ACTIVITY)"
      - "Tabelas master/bridge misturando múltiplas entidades"
    examples:
      CONTRACT: ["CustomerName", "DealerCode", "DealerName", "AdvisorName"]
      TRANSACTION: ["CustomerID", "DealerID", "SupplierID"]
      PARTY: ["CustomerCountry", "DealerCountry", "SupplierCountry"]
    rationale: "Prefixos desambiguam quando tabela contém relações para múltiplos tipos de entidade. Sem prefixo, um campo 'Name' poderia referir-se a Cliente, Dealer ou Fornecedor."

# ============================================================
# SEÇÃO 4: ALIASES AMBÍGUOS
# ============================================================
ambiguous_aliases:
  - name: "Country / País"
    description: "Pode significar país do cliente, dealer, ou fabricante"
    resolution_rules:
      single_entity: "Use 'Country' no contexto de tabela única."
      multi_entity: "Use 'CustomerCountry', 'DealerCountry' para desambiguar."
      rule_of_thumb: "Prefixe o nome da entidade quando em tabelas cruzadas."

  - name: "Name / Nome"
    description: "Cliente? Dealer? Advisor? Precisa desambiguar"
    resolution_rules:
      CUSTOMER_table: "Apenas 'Name'"
      DEALER_table: "Apenas 'Name'"
      multi_entity: "'CustomerName', 'DealerName', 'AdvisorName'"

  - name: "NationalID / Documento"
    description: "CPF, CNPJ, DNI, RUT? Contexto é tudo"
    resolution_rules:
      rule: "Sempre verifique o campo 'DocumentType' para determinar se é Individual (CPF/DNI) ou Legal Entity (CNPJ/CUIT)."
      storage: "Armazene normalizado sem formatação especial no banco."

# ============================================================
# SEÇÃO 5: DATETIME STANDARDS
# ============================================================
datetime_standards:
  timezone: "UTC"
  date_format: "YYYY-MM-DD"
  timestamp_format: "YYYY-MM-DDTHH:MM:SS.sssZ"
  naming:
    created: "CreatedAt"
    updated: "UpdatedAt"
    deleted: "DeletedAt"
    effective: "EffectiveDate"
    expiration: "ExpirationDate"

# ============================================================
# SEÇÃO 6: GLOSSÁRIO
# ============================================================
glossary:
  PII: "Personally Identifiable Information — dados que podem identificar um indivíduo."
  PascalCase: "Cada palavra inicia com maiúscula, sem separadores. Ex: CustomerName."
  snake_case: "Palavras separadas por underscore, tudo minúsculo. Ex: stg_customers."
  UPPER_CASE: "Tudo em maiúsculo, palavras separadas por underscore. Ex: CUSTOMER."
  CTE: "Common Table Expression — subconsulta nomeada em SQL."
  FK: "Foreign Key — referência a chave primária de outra tabela."
  VIN: "Vehicle Identification Number — código único do veículo."
  GUID: "Globally Unique Identifier — identificador único universal."
  DDL: "Data Definition Language — comandos SQL de criação de estrutura."
  ETL: "Extract, Transform, Load — processo de integração de dados."
  SLA: "Service Level Agreement — acordo de nível de serviço."

# ============================================================
# SEÇÃO 7: LAKE / PLATFORM STANDARDS
# ============================================================
lake_standards:
  zones:
    - name: "raw"
      alias: "bronze"
      description: "Dados brutos, sem transformação"
      naming_pattern: "raw_{source}_{entity}"
      retention: "90 days"
    - name: "staged"
      alias: "silver"
      description: "Dados limpos, deduplicados, tipados"
      naming_pattern: "stg_{domain}_{entity}"
      retention: "1 year"
    - name: "curated"
      alias: "gold"
      description: "Dados modelados para consumo (dim/fact)"
      naming_pattern: "{type}_{entity}"
      types: ["dim", "fact", "agg", "rpt"]
      retention: "indefinite"
  project_structure:
    pattern: "{org}-{env}-{domain}"
    examples:
      - "acme-prod-analytics"
      - "acme-dev-marketing"

# ============================================================
# SEÇÃO 8: AI AGENT INSTRUCTIONS
# Machine-readable para agentes de IA
# ============================================================
ai_agent_instructions:
  description: |
    Esta seção é destinada a agentes de IA que precisam escrever
    artefatos (SQL, schemas, documentação) aderentes a este padrão
    taxonômico. Consulte estas regras antes de gerar qualquer artefato.

  quick_rules:
    - "Colunas SEMPRE em PascalCase"
    - "Nomes de entidade/tabela SEMPRE em UPPER_CASE"
    - "CTEs SEMPRE em snake_case"
    - "Nunca abrevie palavras (Customer, não Cust)"
    - "Siglas canônicas SEMPRE em UPPER_CASE dentro de nomes compostos"
    - "Em tabelas single-entity, NÃO prefixe com nome da entidade"
    - "Em tabelas multi-entity, SEMPRE prefixe com nome da entidade"
    - "Timestamps em UTC, formato ISO 8601"
    - "Nomes de aplicação preservam casing oficial"
    - "Todo registro deve ter CreatedAt e UpdatedAt"

  validation_checklist:
    - check: "column_casing"
      rule: "Todas as colunas devem usar PascalCase"
      regex: "^[A-Z][a-zA-Z0-9]*$"
      exception: "Acronyms canônicos mantêm UPPER_CASE (ex: VIN, GUID)"
    - check: "entity_casing"
      rule: "Nomes de entidade/tabela devem usar UPPER_CASE"
      regex: "^[A-Z][A-Z0-9_]*$"
    - check: "no_abbreviations"
      rule: "Palavras completas obrigatórias"
      forbidden_suffixes: ["Num", "Desc", "Addr", "Sts", "Cust", "Qty", "Amt"]
    - check: "acronym_casing"
      rule: "Acronyms canônicos devem manter UPPER_CASE"
      canonical_list_ref: "naming_conventions.canonical_acronyms.items"
    - check: "forbidden_patterns"
      rule: "Patterns de casing misto proibidos"
      forbidden_list_ref: "naming_conventions.forbidden_forms.items"
    - check: "context_prefix"
      rule: "Prefixar por entidade apenas em tabelas multi-entity"
      lookup: "context_rules"

  artifact_templates:
    sql_select: |
      -- Gerado seguindo taxonomy_schema.yaml
      -- Colunas: PascalCase | Entidades: UPPER_CASE | CTEs: snake_case
      SELECT
        CustomerName,           -- ✓ PascalCase
        CustomerGUID,           -- ✓ Acronym UPPER_CASE preservado
        CreatedAt               -- ✓ Timestamp padrão
      FROM CUSTOMER             -- ✓ Entidade UPPER_CASE
    ddl_create: |
      CREATE TABLE {ENTITY_UPPER} (
        {ColumnPascal} {DATA_TYPE},
        CreatedAt TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UpdatedAt TIMESTAMP
      );

# ============================================================
# SEÇÃO 9: VALIDATION RULES (Machine-Readable)
# ============================================================
validation_rules:
  - id: "VAL-001"
    name: "Column PascalCase Check"
    severity: "error"
    scope: "column"
    rule_type: "regex"
    pattern: "^[A-Z][a-zA-Z0-9]*$"
    message: "Coluna '{name}' não segue PascalCase"
  - id: "VAL-002"
    name: "No Abbreviation Check"
    severity: "error"
    scope: "column"
    rule_type: "forbidden_substring"
    forbidden: ["Cust", "Addr", "Num", "Desc", "Sts", "Qty", "Amt"]
    message: "Coluna '{name}' contém abreviação proibida"
  - id: "VAL-003"
    name: "Entity UPPER_CASE Check"
    severity: "error"
    scope: "table"
    rule_type: "regex"
    pattern: "^[A-Z][A-Z0-9_]*$"
    message: "Tabela '{name}' não segue UPPER_CASE"
  - id: "VAL-004"
    name: "Acronym Casing Check"
    severity: "warning"
    scope: "column"
    rule_type: "acronym_case"
    canonical_ref: "naming_conventions.canonical_acronyms.items"
    message: "Acronym em '{name}' deve manter UPPER_CASE"
  - id: "VAL-005"
    name: "Timestamp Naming Check"
    severity: "warning"
    scope: "column"
    rule_type: "datetime_naming"
    expected_ref: "datetime_standards.naming"
    message: "Campo de data/hora '{name}' não segue padrão de naming"
  - id: "VAL-006"
    name: "Zone Naming Check"
    severity: "warning"
    scope: "dataset"
    rule_type: "zone_prefix"
    expected_ref: "lake_standards.zones"
    message: "Dataset '{name}' não segue padrão de zona (raw/stg/dim/fact)"
