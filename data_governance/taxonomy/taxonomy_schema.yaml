# ============================================================
# SEÇÃO 1: NAMING CONVENTIONS & PRINCÍPIOS FUNDAMENTAIS
# ============================================================
naming_conventions:
  casing_rules:
    columns: "PascalCase"
    entities: "UPPER_CASE"
    ctes: "snake_case"
    examples:
      column: ["CustomerName", "NationalID"]
      entity: ["CUSTOMER", "AGENDA_CUSTOMERS"]
      cte: ["stg_customers", "dim_vehicles"]

  canonical_acronyms:
    description: "Siglas que devem ser mantidas em MAIÚSCULO, mesmo no meio de nomes PascalCase"
    items: ["VIN", "GUID", "GPS", "MFA", "DNA", "KM", "API", "URL", "SQL", "ID"]
    rule: "Sempre UPPER_CASE dentro de nomes compostos. Ex: CustomerGUID, não CustomerGuid."

  forbidden_forms:
    description: "Formas de casing misto que nunca devem ser usadas"
    items:
      - pattern: "Customer_Id"
        reason: "Mixed case with underscore"
      - pattern: "customerID"
        reason: "camelCase não é permitido"
      - pattern: "CUSTOMERName"
        reason: "All-caps prefix misturado com PascalCase"
      - pattern: "dealer_code"
        reason: "snake_case não é usado para colunas"

  full_words_required:
    description: "Use palavras completas, nunca abreviações"
    rules:
      - correct: "Customer"
        forbidden: "Cust"
      - correct: "Address"
        forbidden: "Addr"
      - correct: "Number"
        forbidden: "Num"
      - correct: "Description"
        forbidden: "Desc"
      - correct: "Status"
        forbidden: "Sts"

  application_names:
    description: "Nomes de aplicação devem preservar casing oficial"
    items:
      - name: "WhatsApp"
        correct: "WhatsApp"
        forbidden: "whatsapp"
      - name: "Salesforce"
        correct: "Salesforce"
        forbidden: "salesforce"
      - name: "SharePoint"
        correct: "SharePoint"
        forbidden: "sharepoint"
      - name: "BigQuery"
        correct: "BigQuery"
        forbidden: "bigquery"

