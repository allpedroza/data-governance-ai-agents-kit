[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "data-governance-ai-agents-kit"
version = "1.0.0"
description = "AI-powered Data Governance framework with modular agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

# ── Base dependencies (always needed) ──────────────────────────
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "streamlit>=1.32.0",
]

[project.optional-dependencies]
# ── Per-agent groups ─────────────────────────────────────────

lineage = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "matplotlib>=3.6.0",
    "plotly>=5.0.0",
    "sqlparse>=0.4.0",
    "openlineage-python>=1.0.0",
    "kaleido>=0.2.0",
    "python-igraph>=0.10.0",
    "seaborn>=0.12.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.0.0",
    "pyspark>=3.3.0",
    "databricks-sdk>=0.5.0",
]

rag = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "chromadb>=0.4.0",
    "scikit-learn>=1.0.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
]

quality = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "sqlalchemy>=2.0.0",
]

classification = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "sqlalchemy>=2.0.0",
]

warehouse = [
    "sqlalchemy>=2.0.0",
    "snowflake-connector-python>=3.0.0",
    "snowflake-sqlalchemy>=1.5.0",
    "psycopg2-binary>=2.9.0",
    "redshift-connector>=2.0.0",
    "sqlalchemy-redshift>=0.8.0",
    "google-cloud-bigquery>=3.0.0",
    "google-cloud-bigquery-storage>=2.0.0",
    "sqlalchemy-bigquery>=1.6.0",
    "pyodbc>=4.0.0",
    "azure-identity>=1.12.0",
    "cryptography>=41.0.0",
]

ai_gov = [
    "cryptography>=41.0.0",
]

# ── Cloud connectors (optional) ──────────────────────────────

cloud = [
    "boto3>=1.26.0",
    "azure-storage-blob>=12.14.0",
    "google-cloud-storage>=2.7.0",
]

# ── NLP extras ───────────────────────────────────────────────

spacy = [
    "spacy>=3.5.0",
]

# ── Development / CI ────────────────────────────────────────

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "isort>=5.0.0",
]

docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

# ── Convenience meta-group ───────────────────────────────────

all = [
    "data-governance-ai-agents-kit[lineage,rag,quality,classification,warehouse,ai_gov,cloud,dev,docs]",
]

[tool.setuptools.packages.find]
include = ["data_governance*", "ai_governance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
